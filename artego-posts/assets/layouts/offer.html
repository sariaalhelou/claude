<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Artego — offer post</title>
<link rel="stylesheet" href="artego.css">
<script src="artego.js" defer></script>
</head>
<body>
<!-- OFFER POST (4:5): offer line → headline → sub → services, the space below for the design.
     The red tag is the ONLY place red is allowed, and only for a time-limited offer. -->
<section class="slide">
  <img class="photo" src="photos/01.jpg" style="--pos: 50% 75%">
  <div class="scrim top" style="--h: 50%"></div>

  <div class="zone top" style="--top: 92px">
    <div class="sub" style="--fs: 50px; font-weight: 500; margin: 0">خصم 10% على مشروعك القادم</div>
    <div class="title" style="--fs: 76px; margin-top: 26px">صمّم مساحتك كما تستحق...</div>
    <div class="sub" style="margin-top: 0">ونحن نتولى التفاصيل.</div>
    <div class="services">تصميم داخلي<span class="dot">•</span>تنفيذ<span class="dot">•</span>تأثيث<span class="dot">•</span>إدارة متكاملة للمشروع</div>
  </div>

  <div class="zone" style="top: 1000px"><span class="tag-offer">لفترة محدودة</span></div>
</section>
</body>
</html>
