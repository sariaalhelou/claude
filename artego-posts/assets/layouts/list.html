<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Artego — list post</title>
<link rel="stylesheet" href="artego.css">
<script src="artego.js" defer></script>
</head>
<body>
<!-- LIST POST (4:5): headline + short list in glass rows, the room frames the text on both sides
     (choose a photo whose middle is a calm wall and whose sides carry the furniture/decor). -->
<section class="slide" style="--logo-w: 140px; --logo-bottom: 36px">
  <img class="photo" src="photos/01.jpg" style="--pos: 50% 50%">
  <div class="scrim full" style="--a: .22"></div>
  <div class="scrim top warm" style="--h: 40%; --a: .7"></div>

  <div class="zone top" style="--top: 70px">
    <div class="kicker" style="--fs: 66px">قبل بدء التنفيذ...</div>
    <div class="title charcoal" style="--fs: 96px">ماذا يجب أن تراجع؟</div>
    <div class="divider"></div>
    <div class="lead">5 نقاط أساسية</div>
    <div class="small" style="--fs: 42px">قبل أن تبدأ أعمال التنفيذ</div>

    <div class="list" style="--rh: 78px; --gap: 10px">
      <div class="row"><span class="t">المخططات</span><span class="sep"></span><span class="n">01</span></div>
      <div class="row"><span class="t">الكهرباء والإضاءة</span><span class="sep"></span><span class="n">02</span></div>
      <div class="row"><span class="t">الخامات والتشطيبات</span><span class="sep"></span><span class="n">03</span></div>
      <div class="row"><span class="t">المقاسات والأبعاد</span><span class="sep"></span><span class="n">04</span></div>
      <div class="row"><span class="t">تفاصيل التنفيذ</span><span class="sep"></span><span class="n">05</span></div>
    </div>

    <div class="small" style="margin-top: 40px">قبل أن تبدأ التنفيذ...<br>اجعل كل قرار واضحًا ومعتمدًا</div>
  </div>
</section>
</body>
</html>
