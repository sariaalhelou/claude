<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Artego — carousel</title>
<link rel="stylesheet" href="artego.css">
<script src="artego.js" defer></script>
</head>
<body>
<!-- CAROUSEL (4:5, up to 10 slides). Cover → one point per slide → closing.
     Every slide: text in the top ~35%, the room in the rest, logo bottom-center (auto).
     Use ONE room / one photo series for the whole carousel so it reads as one story
     (same space from different angles, or one panorama: class="photo pano" style="--n:7;--i:0"). -->

<!-- 1. COVER -->
<section class="slide">
  <img class="photo" src="photos/01.jpg" style="--pos: 50% 60%">
  <div class="scrim top" style="--h: 40%"></div>
  <div class="zone top edge" style="--top: 170px">
    <div class="title walnut">هل تدير مشروعك<br>بنفسك؟</div>
    <div class="band" style="margin-top: 20px">
      <div class="sub" style="margin: 0; color: #2f2b28; line-height: 1.35"><span class="b" style="font-size: 66px">5 علامات</span> تقول إنك تحتاج إلى<br>جهة تتولى المشروع بالكامل.</div>
    </div>
    <div class="pill">تصميم داخلي</div>
  </div>
  <div class="swipe edge-ok"><div class="circle"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div><div class="label">اسحب</div></div>
</section>

<!-- 2…N. POINT — one idea per slide -->
<section class="slide">
  <img class="photo" src="photos/02.jpg" style="--pos: 50% 70%">
  <div class="scrim top" style="--h: 38%"></div>
  <div class="zone top" style="--top: 70px">
    <div class="num-title"><span class="n">01</span><span class="bar">|</span>وقتك لا يسمح</div>
    <div class="body" style="--fs: 44px; margin-top: 14px">لديك عملك والتزاماتك، ولا<br>تريد أن تقضي يومك في متابعة<br>تفاصيل المشروع.</div>
  </div>
</section>

<!-- LAST. CLOSING — brand line + contact -->
<section class="slide">
  <img class="photo" src="photos/03.jpg" style="--pos: 50% 70%">
  <div class="scrim top" style="--h: 46%"></div>
  <div class="zone top" style="--top: 80px">
    <div class="title walnut" style="--fs: 84px">دعنا نتولى<br>تصميم وتنفيذ مشروعك</div>
    <div class="body" style="margin-top: 6px">وأنت استمتع بالنتيجة.</div>
    <div class="contact"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>00966508510024</div>
  </div>
</section>
</body>
</html>
