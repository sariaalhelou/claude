<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Artego — single post</title>
<link rel="stylesheet" href="artego.css">
<script src="artego.js" defer></script>
</head>
<body>
<!-- SINGLE POST (4:5). Text in the calm top band of the photo, the design fills the rest.
     Replace photos/01.jpg; move the crop with --pos (x% y%) and --zoom.
     Use the user's text word for word. Delete any line the brief doesn't have. -->
<section class="slide">
  <img class="photo" src="photos/01.jpg" style="--pos: 50% 70%">
  <div class="scrim top" style="--h: 44%"></div>

  <div class="zone top" style="--top: 92px">
    <div class="title">اتركـ التفاصيل لنا...</div>
    <div class="sub">واستلم بيتك على المفتاح.</div>
    <div class="en-tag">DESIGN • EXECUTION • DELIVERY</div>
  </div>
</section>
</body>
</html>
