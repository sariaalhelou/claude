<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Logo intro / sting: shapes converge → logo reveal → name + tagline → hold. 6s
     Uses the Tartip logo (logo-dark-bg.png / logo-light-bg.png from assets/brand). -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="stage.css">
<style>
  .bg { position: absolute; inset: 0; background: var(--bg); }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

  /* converging shapes */
  .shape { position: absolute; left: 50%; top: 46%; border-radius: 50%; opacity: 0;
           animation: converge 1.1s var(--ease-in) var(--d) forwards; }
  @keyframes converge {
    0%   { opacity: 0; transform: translate(var(--x), var(--y)) scale(1); }
    15%  { opacity: 1; }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(0); }
  }

  /* flash ring at the moment of impact */
  .burst { position: absolute; left: 50%; top: 46%; width: 900px; height: 900px; margin: -450px 0 0 -450px;
           border-radius: 50%; border: 10px solid var(--brand-secondary); opacity: 0;
           animation: burst .9s var(--ease-out) 1.2s both; }
  @keyframes burst { 0% { opacity: 1; transform: scale(.05) } 100% { opacity: 0; transform: scale(1) } }

  .logo-box { position: absolute; left: 50%; top: 46%; width: 800px; height: 278px; margin: -139px 0 0 -400px;
              animation: logo-in .9s var(--ease-pop) 1.2s both; }
  /* brand rule: never rotate, stretch or recolor the logo — scale + blur only */
  @keyframes logo-in { 0% { opacity: 0; transform: scale(.6); filter: blur(20px) } 100% { opacity: 1; transform: none; filter: none } }
  .logo-box img { width: 100%; height: 100%; object-fit: contain; }
  .logo-ph { width: 100%; height: 100%; border-radius: 80px; background: var(--brand-primary);
             display: grid; place-items: center; font: 900 96px var(--font-display); color: var(--brand-light); }
  .shine { position: absolute; inset: 0; border-radius: 80px; overflow: hidden; }
  .shine::after { content: ""; position: absolute; top: -50%; bottom: -50%; width: 40%;
                  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
                  transform: translateX(400%) skewX(-20deg); animation: sweep .8s ease-in-out 2.2s both; }
  @keyframes sweep { from { transform: translateX(400%) skewX(-20deg) } to { transform: translateX(-300%) skewX(-20deg) } }

  .name { position: absolute; top: 1150px; left: 0; right: 0; text-align: center; font-size: 96px;
          animation: wipe-in .8s var(--ease-out) 2s both; }
  .tagline { position: absolute; top: 1330px; left: 0; right: 0; text-align: center; font-size: 52px;
             color: var(--brand-secondary); font-weight: 700; animation: rise-in .7s var(--ease-out) 2.6s both; }
  .bar { position: absolute; top: 1310px; left: 390px; right: 390px; height: 6px; background: var(--brand-secondary);
         transform-origin: right; animation: grow-x .6s var(--ease-out) 2.4s both; }
</style>
</head>
<body data-duration="6" data-width="1080" data-height="1920">
<div class="stage">
  <div class="bg"></div>
  <div class="shape" style="width:160px;height:160px;background:var(--brand-primary);--x:300px;--y:-700px;--d:.1s"></div>
  <div class="shape" style="width:110px;height:110px;background:var(--brand-secondary);--x:-480px;--y:-300px;--d:.2s"></div>
  <div class="shape" style="width:200px;height:200px;background:var(--brand-white);--x:-400px;--y:600px;--d:.15s"></div>
  <div class="shape" style="width:90px;height:90px;background:var(--brand-secondary);--x:420px;--y:420px;--d:.25s"></div>
  <div class="burst"></div>

  <div class="logo-box">
    <img src="logo-dark-bg.png" alt="">
  </div>
  <div class="bar"></div>
  <div class="name display brand-gradient-text">نرتّب حضورك الرقمي</div>
  <div class="tagline"><span class="brand-handle"><span class="ig"></span><bdi>tartipagency</bdi></span></div>
</div>
<script src="mg.js"></script>
</body>
</html>
