<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Artego — details list</title>
<link rel="stylesheet" href="artego.css">
<script src="artego.js" defer></script>
<style>
  /* layout preview without a photo: the cream column = area that must be a calm wall */
  .wall { position:absolute; left:200px; right:200px; top:0; bottom:200px; background:#EFE6DA; z-index:0 }
  .sides { position:absolute; inset:0; background: repeating-linear-gradient(135deg,#d9c9b6 0 18px,#e3d5c4 18px 36px); z-index:0 }
</style>
</head>
<body>
<section class="slide no-photo" style="--logo-w: 150px; --logo-bottom: 34px">
  <!-- <img class="photo" src="photos/01.jpg" style="--pos: 50% 50%"> -->
  <div class="sides"></div><div class="wall"></div>

  <div class="zone top" style="--top: 64px">
    <div class="kicker" style="--fs: 54px">الفخامة ليست في كثرة التفاصيل...</div>
    <div class="title charcoal" style="--fs: 80px; margin-top: 4px">بل في اختيار<br>التفاصيل المناسبة.</div>
    <div class="divider" style="--w: 420px; --m: 26px"></div>

    <div class="list" style="--w: 600px; --rh: 76px; --gap: 12px; margin-top: 0">
      <div class="row"><span class="t">توزيع يحقق الراحة</span><span class="sep"></span><span class="n">01</span></div>
      <div class="row"><span class="t">خامات تنسجم معًا</span><span class="sep"></span><span class="n">02</span></div>
      <div class="row"><span class="t">إضاءة تخدم التصميم</span><span class="sep"></span><span class="n">03</span></div>
      <div class="row"><span class="t">تشطيبات دقيقة</span><span class="sep"></span><span class="n">04</span></div>
      <div class="row"><span class="t">تنفيذ يحترم الرؤية</span><span class="sep"></span><span class="n">05</span></div>
    </div>

    <div class="body" style="--fs: 40px; margin-top: 34px; font-weight: 500">هل حان وقت تصميم مساحة تعكس ذوقك؟</div>
    <div class="body" style="--fs: 40px; font-weight: 700; color: var(--copper)">ابدأ مع <bdi>Artego</bdi>.</div>
    <div class="contact" style="--fs: 28px; margin-top: 12px"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>00966508510024</div>
  </div>
</section>
</body>
</html>
