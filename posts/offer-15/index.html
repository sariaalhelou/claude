<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Artego — offer 15%</title>
<link rel="stylesheet" href="artego.css">
<script src="artego.js" defer></script>
<style>
  .offer-col { position: absolute; z-index: 2; left: 56px; width: 390px; top: 425px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .offer-col .pct { white-space: nowrap; font-weight: 800; font-size: 80px; line-height: 1.05; color: var(--espresso); }
  .offer-col .terms { font-size: 30px; font-weight: 500; line-height: 1.4; color: var(--charcoal); margin-top: 4px; }
  .offer-col .tag-offer { margin-top: 14px; font-size: 36px; }
  .cta { position: absolute; z-index: 2; left: 80px; right: 80px; top: 975px; text-align: center; }
</style>
</head>
<body>
<!-- photo: Gemini, user-supplied (unfinished concrete → finished living room) -->
<section class="slide" style="--logo-w: 140px; --logo-bottom: 26px">
  <img class="photo" src="photos/01.jpg" style="--pos: 50% 50%">
  <div class="scrim top" style="--h: 40%; --a: .88"></div>
  <div class="scrim" style="left:0; width:520px; right:auto; top:380px; height:400px; background: radial-gradient(closest-side, rgba(239,232,224,.92), rgba(239,232,224,0))"></div>
  <div class="scrim bottom light" style="--h: 34%; --a: .95"></div>

  <div class="zone top" style="--top: 74px">
    <div class="kicker" style="--fs: 56px">هل حان وقت مشروعك؟</div>
    <div class="title" style="--fs: 82px; margin-top: 6px">مشروعك المؤجل...<br>يستحق أن يبدأ الآن.</div>
    <div class="sub" style="--fs: 44px; margin-top: 6px">ابدأ رحلتك مع <bdi>Artego</bdi>.</div>
  </div>

  <div class="offer-col">
    <div class="pct">خصم <bdi dir="ltr">15%</bdi></div>
    <div class="terms">على خدمات التصميم والتنفيذ<br>المشمولة بالعرض.</div>
    <span class="tag-offer">لفترة محدودة</span>
  </div>

  <div class="cta">
    <div class="body" style="--fs: 40px; font-weight: 600; color: var(--walnut)">حوّل رؤيتك إلى مساحة متكاملة.</div>
    <div class="small" style="--fs: 30px">تواصل معنا لمعرفة التفاصيل والاستفادة من العرض.</div>
    <div class="contact" style="margin-top: 6px; --fs: 28px"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>00966508510024</div>
  </div>
</section>
</body>
</html>
